# Pre-commit guardrails — the deterministic hooks that run before every commit.
# Enable once with `make setup` (runs `pre-commit install`).
# See docs/AGENTIC_ENGINEERING_SDLC_PLAN.md §5.4.
#
# Note: the expert float-output contract (docs/memory/0002) is *not* enforced
# here — it is runtime LLM behavior, verified by evals (Phase 2), not a static hook.

exclude: '^(\.openlogic-env/|\.adk/|assets/|scratch/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: detect-private-key

  # Lint + format (Python). Config lives in pyproject.toml [tool.ruff].
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Secret scanning — hard rule #4 (no secrets in code).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
