name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --extra dev --extra rag

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests + evalset validation (pytest)
        run: uv run pytest -q

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Scored agent evals invoke the model, so they need a key. This job runs only
  # when a GEMINI_API_KEY secret is configured; otherwise it is skipped (the
  # well-formedness of evalsets is already checked by pytest above).
  agent-evals:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.11
      - run: uv sync --extra dev --extra rag
      - name: Run ADK evals (skipped without GEMINI_API_KEY)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY not set — skipping scored agent evals."
            exit 0
          fi
          uv run adk eval model_library/agentic_ai/moe_coordinator \
            model_library/agentic_ai/moe_coordinator/eval/trajectory.evalset.json \
            --config_file_path model_library/agentic_ai/moe_coordinator/eval/test_config.json
