name: Keep Streamlit app awake

# Pings the deployed app on a schedule so Streamlit Community Cloud
# never marks it inactive. As long as traffic keeps arriving, the app
# stays warm and visitors land on a ready page (no "wake it up" button).

on:
  schedule:
    # Every 5 minutes. GitHub runs scheduled jobs on a best-effort basis
    # and may delay or skip runs under load — that's fine, the Cloud
    # inactivity window is far longer than a few minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:   # allow manual runs from the Actions tab

# Don't let a slow ping overlap with the next scheduled run.
concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: |
          # Streamlit Community Cloud answers the first request with an
          # anonymous session handshake (303 -> /-/auth/app -> back to the
          # app). curl must persist cookies through that chain, otherwise
          # it loops on the redirect and never reaches the app.
          jar="$(mktemp)"
          curl -sSL \
            --cookie-jar "$jar" --cookie "$jar" \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-redirs 30 --max-time 90 \
            -A "keep-awake-bot (github-actions; +https://github.com/${GITHUB_REPOSITORY})" \
            -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            "https://openlogicfinance.streamlit.app/"
